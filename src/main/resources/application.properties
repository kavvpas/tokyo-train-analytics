# ローカル実行時は、プロジェクト直下の .env(Git 管理外)があれば読み込む
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8081}

# DB 接続情報は環境変数で渡す(パスワードはコードに書かない)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/train_db?useSSL=false&serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# 遅延情報 API の URL。未設定の場合は内蔵のサンプルデータを使う
odpt.api-url=${ODPT_API_URL:}

# ヘルスチェック(/actuator/health のみ公開)
management.endpoints.web.exposure.include=health
